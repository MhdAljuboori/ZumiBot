# Goes in /etc/nginx/sites-available/zumibot. Then run: certbot --nginx -d zumibot-server.mhdaljuboori.me
# (certbot adds the TLS lines).
server {
    listen 80;
    listen [::]:80;
    server_name zumibot-server.mhdaljuboori.me;

    client_max_body_size 26m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Overwrite, never append: the server trusts this single value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
}
